# Nginx configuration for FuncaoODM
#
# A SPA é servida sob /drone/ (base href = /drone/), tanto standalone (porta 8088)
# quanto atrás do gateway da plataforma (Fase 2). Expõe /odm-api e /ws para que o
# Angular (apiUrl = /odm-api; WebSocket em /ws/websocket) funcione nos dois modos.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    types { application/wasm wasm; }
    sendfile on;
    keepalive_timeout 65;

    # Disable max body size limit (user-defined limits enforced in app)
    client_max_body_size 0;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upgrade de WebSocket (anotações em tempo real)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;     # a SPA está em ./drone (base href /drone/)
        index index.html;

        # Standalone: raiz redireciona para a app
        location = / {
            return 302 /drone/;
        }

        # Cache de assets estáticos (sob /drone/) — regex tem precedência, então
        # vem antes do prefixo /drone/.
        location ~* ^/drone/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|wasm)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # SPA Angular sob /drone/ (o caminho da URL espelha o filesystem)
        location /drone/ {
            try_files $uri $uri/ /drone/index.html;

            # Disable caching for index/navegação
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            expires off;
        }

        # Drone: API Java (apiUrl do Angular = /odm-api -> /api/v1/)
        location /odm-api/ {
            rewrite ^/odm-api/(.*)$ /api/v1/$1 break;
            proxy_pass http://java-service:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;

            # Timeout settings for large uploads
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_read_timeout 300;
        }

        # Compatibilidade: mantém /api/v1/ direto (caso algo ainda use)
        location /api/v1/ {
            proxy_pass http://java-service:8080/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_read_timeout 300;
        }

        # Drone: WebSocket das anotações (ws://host/ws/websocket)
        location /ws/ {
            proxy_pass http://java-service:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600;
        }

        # NodeODM direct API (proxied)
        location /nodeodm-api/ {
            rewrite ^/nodeodm-api/(.*) /$1 break;
            proxy_pass http://nodeodm:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout settings specific to NodeODM operations
            proxy_connect_timeout 600;
            proxy_send_timeout 600;
            proxy_read_timeout 600;
        }
    }
}
