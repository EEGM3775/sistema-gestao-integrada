<div class="map-controls">
  <!-- Zoom Controls -->
  <div class="control-group zoom-controls">
    <button class="control-btn" (click)="onZoomIn()" title="Zoom In">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-4.35M8 11h6M11 8v6"/>
      </svg>
    </button>
    <button class="control-btn" (click)="onZoomOut()" title="Zoom Out">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-4.35M8 11h6"/>
      </svg>
    </button>
    <button class="control-btn" (click)="onFitBounds()" title="Fit to Bounds">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
      </svg>
    </button>
  </div>

  <!-- View Controls -->
  <div class="control-group view-controls">
    <button
      class="control-btn"
      [class.active]="currentBasemap === 'satellite'"
      (click)="setBasemap('satellite')"
      title="Satélite"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
    </button>
    <button
      class="control-btn"
      [class.active]="currentBasemap === 'street'"
      (click)="setBasemap('street')"
      title="Mapa"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
        <line x1="8" y1="2" x2="8" y2="18"/>
        <line x1="16" y1="6" x2="16" y2="22"/>
      </svg>
    </button>
    <button
      class="control-btn"
      [class.active]="currentBasemap === 'terrain'"
      (click)="setBasemap('terrain')"
      title="Terreno"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="m8 3 4 8 5-5 5 15H2L8 3z"/>
      </svg>
    </button>
  </div>

  <!-- Measurement Tools -->
  <div class="control-group measurement-tools">
    <button
      class="control-btn"
      [class.active]="measurementMode === 'distance'"
      (click)="setMeasurementMode(measurementMode === 'distance' ? null : 'distance')"
      title="Medir Distância"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M2 12h20M12 2v20"/>
      </svg>
    </button>
    <button
      class="control-btn"
      [class.active]="measurementMode === 'area'"
      (click)="setMeasurementMode(measurementMode === 'area' ? null : 'area')"
      title="Medir Área"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
      </svg>
    </button>
    <button
      class="control-btn"
      [class.active]="measurementMode === 'volume'"
      (click)="setMeasurementMode(measurementMode === 'volume' ? null : 'volume')"
      title="Medir Volume"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
      </svg>
    </button>
  </div>

  <!-- Layers Toggle -->
  <div class="control-group">
    <button
      class="control-btn"
      [class.active]="showLayers"
      (click)="onToggleLayers()"
      title="Camadas"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/>
        <path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/>
        <path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>
      </svg>
    </button>
  </div>
</div>
