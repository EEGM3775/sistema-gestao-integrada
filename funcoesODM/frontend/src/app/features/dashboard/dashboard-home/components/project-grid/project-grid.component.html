<div class="projects-grid">
  <div
    *ngFor="let project of projects"
    class="project-card"
    [routerLink]="['/projects', project.id]"
  >
    <!-- Card Thumbnail -->
    <div class="card-thumbnail">
      <img
        [src]="project.thumbnail"
        [alt]="project.name"
        loading="lazy"
        (error)="onImageError($event)"
      />
      <div class="card-overlay">
        <span class="image-count">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          {{ project.imageCount }} imagens
        </span>
      </div>
      <div class="status-badge" [class]="project.status.toLowerCase()">
        {{ getStatusLabel(project.status) }}
      </div>
    </div>

    <!-- Card Content -->
    <div class="card-content">
      <h3 class="project-name">{{ project.name }}</h3>
      <p class="project-description">{{ project.description }}</p>

      <!-- Progress Bar for Processing -->
      <div *ngIf="project.status === 'PROCESSING'" class="progress-section">
        <div class="progress-info">
          <span>Processando...</span>
          <span>{{ project.progress }}%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" [style.width.%]="project.progress"></div>
        </div>
      </div>

      <!-- Card Meta -->
      <div class="card-meta">
        <span class="meta-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          {{ project.createdAt | date:'dd/MM/yy' }}
        </span>
        <span class="meta-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          {{ project.area }}
        </span>
      </div>
    </div>

    <!-- Card Actions -->
    <div class="card-actions">
      <button class="action-btn" (click)="onMapClick($event, project)" title="Ver Mapa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
          <line x1="8" y1="2" x2="8" y2="18"/>
          <line x1="16" y1="6" x2="16" y2="22"/>
        </svg>
      </button>
      <button class="action-btn" (click)="onDownloadClick($event, project)" title="Download">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </button>
      <button class="action-btn" (click)="onMenuClick($event, project)" title="Mais opções">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="1"/>
          <circle cx="19" cy="12" r="1"/>
          <circle cx="5" cy="12" r="1"/>
        </svg>
      </button>
    </div>
  </div>
</div>
