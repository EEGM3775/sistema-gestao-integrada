<div class="stats-bar">
  <!-- Total de Projetos -->
  <div class="stat-item">
    <div class="stat-icon total">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
      </svg>
    </div>
    <div class="stat-content">
      <span class="stat-value">{{ stats.totalProjects }}</span>
      <span class="stat-label">Total de Projetos</span>
    </div>
  </div>

  <!-- Processando -->
  <div class="stat-item">
    <div class="stat-icon processing">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
    </div>
    <div class="stat-content">
      <span class="stat-value">{{ stats.processing }}</span>
      <span class="stat-label">Processando</span>
    </div>
  </div>

  <!-- Concluídos -->
  <div class="stat-item">
    <div class="stat-icon completed">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
    </div>
    <div class="stat-content">
      <span class="stat-value">{{ stats.completed }}</span>
      <span class="stat-label">Concluídos</span>
    </div>
  </div>

  <!-- Total de Imagens -->
  <div class="stat-item">
    <div class="stat-icon images">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
    </div>
    <div class="stat-content">
      <span class="stat-value">{{ stats.totalImages }}</span>
      <span class="stat-label">Imagens</span>
    </div>
  </div>
</div>
