<div class="controls-panel">
  <!-- Camera Mode Controls -->
  <div class="control-group">
    <button
      class="control-btn"
      [class.active]="viewMode === 'orbit'"
      (click)="setViewMode('orbit')"
      title="Modo Órbita"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 2v20M2 12h20"/>
      </svg>
    </button>
    <button
      class="control-btn"
      [class.active]="viewMode === 'pan'"
      (click)="setViewMode('pan')"
      title="Modo Pan"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3"/>
      </svg>
    </button>
    <button
      class="control-btn"
      [class.active]="viewMode === 'zoom'"
      (click)="setViewMode('zoom')"
      title="Modo Zoom"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-4.35M8 11h6M11 8v6"/>
      </svg>
    </button>
  </div>

  <!-- Action Controls -->
  <div class="control-group">
    <button
      class="control-btn"
      (click)="onResetCamera()"
      title="Reset Câmera"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
        <path d="M21 3v5h-5"/>
      </svg>
    </button>
    <button
      class="control-btn"
      (click)="onTakeScreenshot()"
      title="Screenshot"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
    </button>
    <button
      class="control-btn"
      (click)="onToggleFullscreen()"
      title="Tela Cheia"
    >
      <svg *ngIf="!isFullscreen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>
      </svg>
      <svg *ngIf="isFullscreen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/>
      </svg>
    </button>
  </div>
</div>
