<div class="stats-panel">
  <div class="stat">
    <span class="stat-label">Pontos</span>
    <span class="stat-value">{{ formatNumber(stats.points) }}</span>
  </div>
  <div class="stat">
    <span class="stat-label">FPS</span>
    <span class="stat-value">{{ stats.fps }}</span>
  </div>
  <div class="stat">
    <span class="stat-label">Memória</span>
    <span class="stat-value">{{ stats.memory }} MB</span>
  </div>
</div>
