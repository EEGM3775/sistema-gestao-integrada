# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
# Fase 5: se JWT_PUBLIC_KEY_PATH apontar para a chave pública RSA da IAM, o drone
# valida RS256 (assimétrico) e o segredo HS256 abaixo deixa de ser necessário.
jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:}
# Segredo HS256 (compat / standalone). Opcional quando há RS256.
jwt.secret=${JWT_SECRET:}
# Usado apenas pela emissão local (modo standalone); ignorado na validação da IAM.
jwt.expiration=${JWT_EXPIRATION:36000000}
# Fase 5 da remodelagem (§10.6): o drone só aceita token emitido pela IAM PARA ele,
# do tipo de pessoa (at+jwt) ou de serviço (svc+jwt, só na rota de desvínculo).
# Os valores são os de funcoesautorizacao/audiencias.py — o teste da IAM confere.
jwt.issuer=${JWT_ISSUER:sgi-iam}
jwt.audience=${JWT_AUDIENCE_DRONE:sgi-drone}

# --- Revogação imediata de sessão (Fase 10.6.5) ---
# Espelho do ERP: rejeita access token cujo `iat` seja anterior ao carimbo que a
# IAM grava no Redis (DB 2) ao trocar/resetar senha ou desativar o usuário. Sem
# isto, o drone mantém a janela residual de <= access TTL. Redis fora + fail-open
# (padrão) => não bloqueia (ver docs/acesso-e-permissoes.md §5.1).
session.revocation.enabled=${SESSION_REVOCATION_ENABLED:true}
session.revocation.fail-open=${SESSION_REVOCATION_FAIL_OPEN:true}
session.revoke.redis-url=${SESSION_REVOKE_REDIS_URL:redis://localhost:6379/2}
session.revoke.prefix=${SESSION_REVOKE_PREFIX:sess:revoked_after:}
# Fase 4: a sessão (sid) sem Redis é perguntada à IAM, na rede interna.
session.iam-internal-url=${IAM_INTERNAL_URL:http://iam:8001}

# --- PDP (remodelagem da segurança, D205) ---
# "Usa o módulo?" perguntado ao SpiceDB (security/AutorizacaoService), com o
# cache de decisão no Redis DB 5 — as mesmas chaves do backend
# (funcoesautorizacao/chaves.py). Sem SPICEDB_URL, decide pela claim `modules`.
# O relógio da pergunta (`authz.spicedb.timeout-ms`) é teto do dono: vem do
# payment/planos.py pelo arquivo gerado que o compose monta em /authz.
spring.config.import=optional:file:/authz/limites-drone.properties
authz.spicedb.url=${SPICEDB_URL:}
authz.spicedb.chave=${SPICEDB_CHAVE:}
authz.redis-url=${AUTORIZACAO_REDIS_URL:redis://localhost:6379/5}

# --- SSO / Entitlements (Fase 1) ---
# Módulo (entitlement) exigido para acessar este produto. Quem não tiver o módulo
# no token da IAM recebe 403. Ver docs/arquitetura.md, seção 6.
app.module.required=${APP_MODULE_REQUIRED:drone}
# Login local desabilitado: a identidade é sempre da IAM (SSO). Habilite só para
# rodar o funcoesODM isolado, sem a IAM.
app.auth.local-login-enabled=${APP_LOCAL_LOGIN_ENABLED:false}
# Origens permitidas (CORS + handshake WebSocket). Inclui o gateway de borda
# (localhost:8090) — sem ele, o browser servido pelo domínio único é barrado no
# CORS antes mesmo do handshake do /ws (403). Em produção, o domínio real.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8088,http://nginx:80,http://localhost:8090}

# NodeODM Configuration
nodeodm.service.baseurl=http://nodeodm:3000
nodeodm.service.url=http://nodeodm:3000
nodeodm.data.dir=/nodeodm/data

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1
app.upload.dir=/app/uploads

# User-configurable upload limits (defaults and hard caps)
app.upload.default-max-file-mb=100
app.upload.default-max-request-mb=10240
app.upload.hard-max-file-mb=0
app.upload.hard-max-request-mb=0

# Debug logging for Security
logging.level.org.springframework.security=DEBUG
logging.level.com.funcoesodm=DEBUG
