# ============================================================
# Plataforma SGI — compose UNIFICADO (Fase 4).
#
# Perfis:
#   (sem perfil)  -> só infra: postgres + redis
#   --profile full -> plataforma inteira: IAM, backend, React, funcoesODM e gateway
#
# Uso:
#   cp deploy/env/dev.env.example .env
#   docker compose up -d                 # só infra (postgres + redis)
#   docker compose --profile full up -d  # tudo; abra http://localhost:8090/
#
# Tudo numa rede só (sgi). Os nomes de serviço java-service / nodeodm /
# drone-nginx / funcoesodm-db são referenciados em configs internas do drone.
# ============================================================

# Nome do projeto FIXO. Sem isto o Compose o deriva do diretório do arquivo — que
# ao mover para deploy/compose/ passou a ser "compose", renomeando rede e volumes
# (`compose_pg_data` em vez de `02sistema_gestao_integrada_pg_data`). Na prática o
# ambiente de dev subiria com banco, Redis e mídia VAZIOS, como se os dados tivessem
# sumido. O staging sobrescreve via COMPOSE_PROJECT_NAME no seu env-file.
name: ${COMPOSE_PROJECT_NAME:-02sistema_gestao_integrada}

services:
  # ---------- INFRA (sempre) ----------

  # PostgreSQL — cluster de registro do IAM e do backend (bancos iam_db e erp_db)
  #
  # MAP.0: a imagem é a do PostGIS (mesmo Postgres 16 + a extensão espacial), não
  # a baunilha. O volume `pg_data` existente CONTINUA VÁLIDO — a major é a mesma,
  # só muda o que vem instalado —, mas o script de init NÃO reroda num volume já
  # inicializado: num ambiente antigo, crie a extensão uma vez à mão (o comando
  # está em docs/modulos/modulomaps.md §3).
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ${SGI_PREFIX:-sgi}-postgres
    # `track_commit_timestamp` é exigência do SpiceDB (o PDP, fase 2): sem ela,
    # ele desliga o Watch — e sem Watch não há invalidação por evento (§10.8).
    # Custa ~10 bytes por transação e exige reiniciar o Postgres na primeira vez.
    command: ["postgres", "-c", "track_commit_timestamp=on"]
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPbackendASSWORD:-postgres}
      POSTGRES_DB: postgres
      backend_DB: ${POSTGRES_DB:-erp_db}
      backend_USER: ${POSTGRES_USER:-erp_app}
      backend_PASSWORD: ${POSTGRES_PASSWORD:-erp_app_senha_dev}
      IAM_DB: ${IAM_POSTGRES_DB:-iam_db}
      IAM_USER: ${IAM_POSTGRES_USER:-iam_app}
      IAM_PASSWORD: ${IAM_POSTGRES_PASSWORD:-iam_app_senha_dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../../infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [sgi]
    restart: unless-stopped

  # Redis — cache do Django + broker/result do Celery
  redis:
    image: redis:7-alpine
    container_name: ${SGI_PREFIX:-sgi}-redis
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    ports:
      # Porta de host parametrizável para o staging (SGI_PREFIX) coexistir com o dev.
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [sgi]
    restart: unless-stopped

  # ---------- SpiceDB — o PDP da remodelagem da segurança (fases 2 e 3) ----------
  # docs/acesso-e-permissoes.md §10.4: responde "o que você pode fazer?". Não
  # autentica ninguém — quem sabe "quem é você" continua sendo a IAM, que é
  # também a única a escrever relação aqui (`identity/pdp.py`).
  #
  # Guarda os dados no MESMO cluster Postgres, num banco próprio (`spicedb_db`),
  # com role próprio. Três serviços, em ordem: cria o banco (uma volta), migra o
  # datastore (uma volta) e serve. A API HTTP (8443) é a que a IAM e o backend
  # usam; o gRPC (50051) fica para o `zed` de quem opera.
  spicedb-banco:
    image: postgis/postgis:16-3.4
    profiles: ["full"]
    entrypoint: ["sh", "/criar_banco.sh"]
    environment:
      POSTGRES_SUPERUSER: ${POSTGRES_SUPERUSER:-postgres}
      # O nome da variável tem um erro antigo de busca-e-troca ("ERP" → "backend")
      # que está igual em todo env-file, inclusive o de staging com o segredo
      # real. Usa-se o mesmo nome até a troca ser feita em todos de uma vez.
      POSTGRES_SUPERUSER_PASSWORD: ${POSTGRES_SUPbackendASSWORD:-postgres}
      SPICEDB_DB: ${SPICEDB_DB:-spicedb_db}
      SPICEDB_DB_USER: ${SPICEDB_DB_USER:-spicedb_app}
      SPICEDB_DB_PASSWORD: ${SPICEDB_DB_PASSWORD:-spicedb_app_senha_dev}
    volumes:
      - ../../infra/spicedb/criar_banco.sh:/criar_banco.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [sgi]
    restart: "no"

  spicedb-migrar:
    image: authzed/spicedb:v1.45.1
    profiles: ["full"]
    command:
      - datastore
      - migrate
      - head
      - --datastore-engine=postgres
      - --datastore-conn-uri=postgres://${SPICEDB_DB_USER:-spicedb_app}:${SPICEDB_DB_PASSWORD:-spicedb_app_senha_dev}@postgres:5432/${SPICEDB_DB:-spicedb_db}?sslmode=${DB_SSLMODE:-disable}
    depends_on:
      spicedb-banco:
        condition: service_completed_successfully
    networks: [sgi]
    restart: "no"

  spicedb:
    image: authzed/spicedb:v1.45.1
    container_name: ${SGI_PREFIX:-sgi}-spicedb
    profiles: ["full"]
    command:
      - serve
      - --grpc-preshared-key=${SPICEDB_CHAVE:-spicedb-chave-dev}
      # Sem telemetria: por padrão o SpiceDB manda métricas de uso para a
      # authzed.com a cada hora, e consulta o GitHub atrás de versão nova a cada
      # subida. Nada da autorização sai da plataforma.
      - --telemetry-endpoint=
      - --skip-release-check
      - --http-enabled
      - --http-addr=:8443
      - --datastore-engine=postgres
      - --datastore-conn-uri=postgres://${SPICEDB_DB_USER:-spicedb_app}:${SPICEDB_DB_PASSWORD:-spicedb_app_senha_dev}@postgres:5432/${SPICEDB_DB:-spicedb_db}?sslmode=${DB_SSLMODE:-disable}
    # Sem porta publicada: só a IAM, o backend e o invalidador falam com ele,
    # pela rede interna. Quem opera entra por `docker exec` ou pelo `zed`.
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50051"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      spicedb-migrar:
        condition: service_completed_successfully
    networks: [sgi]
    restart: unless-stopped

  # ---------- Mailpit (SMTP de captura — dev/staging) ----------
  # Andaime de desenvolvimento (mesma família do túnel ngrok e do sandbox Asaas):
  # captura todo e-mail enviado pela IAM e o mostra numa UI web, SEM entregar a
  # ninguém de verdade. É o que permite testar a recuperação de senha sem mandar
  # e-mail para caixa real nem usar serviço de terceiro. Aposentado antes do
  # go-live, quando MAIL_HOST passa a apontar para um SMTP real (ver 10.3.2).
  mailpit:
    image: axllent/mailpit:v1.20
    container_name: ${SGI_PREFIX:-sgi}-mailpit
    profiles: ["full", "mail"]
    environment:
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      # 8025 = UI web (leia os e-mails aqui). 1025 = SMTP (a IAM entrega aqui).
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [sgi]
    restart: unless-stopped

  # ---------- IAM (identidade / SSO) ----------
  iam:
    build:
      # Contexto = raiz do repo para a imagem enxergar o pacote compartilhado
      # `funcoesemail/`, que vive fora de iam/.
      context: ../..
      dockerfile: iam/Dockerfile
    container_name: ${SGI_PREFIX:-sgi}-iam
    profiles: ["full"]
    environment:
      # O gêmeo do `large_client_header_buffers` do gateway: o JWT da IAM leva o
      # catálogo de permissões e já passa de 8 KB, e o padrão do gunicorn
      # (`--limit-request-field_size 8190`) devolve **431** antes de o Django ver
      # a requisição. Os dois tetos sobem juntos ou o 431 só troca de porta.
      GUNICORN_CMD_ARGS: --limit-request-field_size 32768 --limit-request-line 8190
      IAM_SECRET_KEY: ${IAM_SECRET_KEY:-django-insecure-iam-dev}
      # Cifra do segredo TOTP de cada pessoa (remodelagem, fase 1). Vazio em dev:
      # a IAM deriva uma do IAM_SECRET_KEY. Fora de DEBUG é obrigatória.
      IAM_SEGUNDO_FATOR_CHAVE: ${IAM_SEGUNDO_FATOR_CHAVE:-}
      IAM_DEBUG: ${IAM_DEBUG:-True}
      IAM_ALLOWED_HOSTS: ${IAM_ALLOWED_HOSTS:-localhost,127.0.0.1,iam,gateway}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-5}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-30}
      # Revogação imediata de sessão (Fase 10.7): Redis compartilhado (DB 2) onde a
      # IAM carimba `revoked_after` ao trocar senha / desativar usuário.
      SESSION_REVOKE_REDIS_URL: ${SESSION_REVOKE_REDIS_URL:-redis://redis:6379/2}
      # Cache da IAM (DB 3) — é onde vive a contagem do throttle (S8). OBRIGATÓRIO
      # aqui: o default do settings é `localhost`, que dentro do container é o
      # próprio container. Sem esta linha a cache falha, o `IGNORE_EXCEPTIONS` a
      # transforma em no-op e o throttle **deixa de contar sem avisar** — protetor
      # que parece ligado e não está. Foi o que aconteceu até 19/07/2026.
      IAM_CACHE_REDIS_URL: ${IAM_CACHE_REDIS_URL:-redis://redis:6379/3}
      # Fase 10.8: segredo do endpoint /auth/service-token/ (JWT serviço→serviço).
      SERVICE_TOKEN_SECRET: ${SERVICE_TOKEN_SECRET:-service-token-dev-secret}
      # D11: e-mail de recuperação de senha. Em dev aponta para o Mailpit (perfil
      # `mail`), que captura tudo e não entrega para fora — nenhum e-mail de teste
      # sai da máquina. Antes do go-live troque MAIL_HOST por um SMTP real.
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Sistema de Gestão <noreply@sistemagestao.com>}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:8090}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      PASSWORD_RESET_COOLDOWN_TROCA_EMAIL_HORAS: ${PASSWORD_RESET_COOLDOWN_TROCA_EMAIL_HORAS:-24}
      IAM_POSTGRES_DB: ${IAM_POSTGRES_DB:-iam_db}
      IAM_POSTGRES_USER: ${IAM_POSTGRES_USER:-iam_app}
      IAM_POSTGRES_PASSWORD: ${IAM_POSTGRES_PASSWORD:-iam_app_senha_dev}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_SSLROOTCERT: ${DB_SSLROOTCERT:-}
      # Fase 5: RS256. A IAM detém a chave privada (assina); a pública vira JWKS.
      JWT_PRIVATE_KEY_PATH: /keys/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem
      # Remodelagem, fase 2: a IAM grava no PDP, na mesma operação, cada troca de
      # papel, acesso ou assinatura (`identity/pdp.py`). Sem SPICEDB_URL, não grava.
      SPICEDB_URL: ${SPICEDB_URL:-http://spicedb:8443}
      SPICEDB_CHAVE: ${SPICEDB_CHAVE:-spicedb-chave-dev}
      # DB 5, da autorização: ZedToken e versão por tenant (funcoesautorizacao/chaves.py).
      AUTORIZACAO_REDIS_URL: ${AUTORIZACAO_REDIS_URL:-redis://redis:6379/5}
    volumes:
      - ../../infra/keys:/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # SEM `spicedb` aqui, de propósito: o PDP fora não pode derrubar o login.
      # A escrita que falhar fica pendente e o `iam-pdp` a refaz.
    healthcheck:
      # Fase 10.1: readiness real (banco + Redis), não só "a porta responde".
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [sgi]
    restart: unless-stopped

  # ---------- backend (Django, resource server da IAM) ----------
  erp:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    container_name: ${SGI_PREFIX:-sgi}-erp
    profiles: ["full"]
    # **D76 — a terceira frota sem teto.** O D57 deu teto à conversão e o D71 à
    # frota geral; sobrou justamente a que atende o cliente. Aqui roda o caminho
    # SÍNCRONO do impexp (arquivo pequeno não vira job — é lido na requisição), e
    # ele lê arquivo que qualquer cliente sobe. Sem `mem_limit` o freio era o host.
    #
    # **O número segue a invariante do D71** — o freio que sabe EXPLICAR estoura
    # antes do que só mata: o `orcamento()` do impexp tem pior caso
    # `IMPEXP_TETO_INFRA_MEMORIA_MB` = 2.048 MB (payment/planos.py), e o gunicorn
    # sobe **1 worker síncrono** (o `CMD` do Dockerfile não passa `--workers`):
    #   1 × 2.048 MB + o processo ≈ 2,3 GB de pico legítimo → `3g` com folga.
    # Mexer em `--workers` muda esta conta: N workers exigem N × 2.048 MB abaixo
    # do `mem_limit`, senão o cgroup mata antes de o `RecursoExcedido` explicar.
    mem_limit: ${ERP_MEM_LIMIT:-3g}
    cpus: ${ERP_CPUS:-2}
    environment:
      # O gêmeo do `large_client_header_buffers` do gateway: o JWT da IAM leva o
      # catálogo de permissões e já passa de 8 KB, e o padrão do gunicorn
      # (`--limit-request-field_size 8190`) devolve **431** antes de o Django ver
      # a requisição. Os dois tetos sobem juntos ou o 431 só troca de porta.
      GUNICORN_CMD_ARGS: --limit-request-field_size 32768 --limit-request-line 8190
      SECRET_KEY: ${SECRET_KEY:-django-insecure-erp-dev}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,erp,gateway}
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_DB: ${POSTGRES_DB:-erp_db}
      POSTGRES_USER: ${POSTGRES_USER:-erp_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_app_senha_dev}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_SSLROOTCERT: ${DB_SSLROOTCERT:-}
      REDIS_URL: redis://redis:6379/0
      # Camada 2 (docs/arquitetura/rate-limiting.md): baldes de token que
      # limitam a SAIDA para fornecedores (NFE.io, Asaas, Meta, LLM, SMTP).
      # DB 4, dedicado: reusar o 0 faria um FLUSHDB de manutencao nos baldes
      # apagar a fila de tarefas do Celery.
      RATE_LIMIT_REDIS_URL: ${RATE_LIMIT_REDIS_URL:-redis://redis:6379/4}
      # Revogação imediata de sessão (Fase 10.7): mesmo Redis/DB da IAM (DB 2). O
      # IamJWTAuthentication rejeita access com `iat` anterior ao carimbo.
      SESSION_REVOKE_REDIS_URL: ${SESSION_REVOKE_REDIS_URL:-redis://redis:6379/2}
      # A1/Fase 10: com worker+beat reais na stack, as tasks vão para o broker
      # em vez de rodarem in-process. Sem isto (default = DEBUG), o webhook do
      # Asaas e a geração de cobrança processariam síncrono e o worker ficaria ocioso.
      CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-False}
      # Fase 5: valida RS256 com a chave pública da IAM (não conhece a privada).
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem
      # D.1.2: integração de cobrança Asaas (sandbox em dev) — services.py/client.py.
      ASAAS_BASE_URL: ${ASAAS_BASE_URL:-https://api-sandbox.asaas.com/v3}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      NFE_IO_BASE_URL: ${NFE_IO_BASE_URL:-https://api.nfe.io/v1}
      NFE_IO_API_KEY: ${NFE_IO_API_KEY:-}
      NFE_IO_COMPANY_ID: ${NFE_IO_COMPANY_ID:-}
      # S7: segredo backend→IA obrigatório fora de DEBUG (sem fallback público).
      IA_SERVICE_SECRET_TOKEN: ${IA_SERVICE_SECRET_TOKEN:-}
      # E-mail (funcoesemail): lembrete de tarefa do CRM e lembrete de evento do
      # calendário. Até 19/07/2026 SÓ a IAM recebia MAIL_*, então esses dois
      # lembretes eram no-op silencioso em todo ambiente — o aviso in-app do
      # calendário funcionava e escondia que o e-mail nunca saía.
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Sistema de Gestão <noreply@sistemagestao.com>}
      # Fase 10.8: reconciliação serviço→serviço com o drone. Pede um JWT de
      # serviço à IAM (SERVICE_TOKEN_SECRET) e desvincula projetos órfãos ao
      # excluir obra/empreendimento. Sem DRONE_SERVICE_URL a reconciliação é no-op.
      SERVICE_TOKEN_SECRET: ${SERVICE_TOKEN_SECRET:-service-token-dev-secret}
      IAM_INTERNAL_URL: ${IAM_INTERNAL_URL:-http://iam:8001}
      DRONE_SERVICE_URL: ${DRONE_SERVICE_URL:-http://java-service:8080}
      # Camada 1 (D23): tetos de ENTRADA. Só o `erp` recebe — worker e beat não
      # servem HTTP. Estas variáveis estavam no .env.example desde o S8 e NUNCA
      # eram repassadas ao container (mesmo defeito do D20 com MAIL_*): o operador
      # ajustava o teto no .env e nada mudava, porque valia sempre o default do
      # settings. THROTTLE_USER fica sem default de propósito — vazio, o settings
      # o DERIVA de THROTTLE_TENANT × THROTTLE_USER_FRACAO.
      THROTTLE_ANON: ${THROTTLE_ANON:-120/min}
      THROTTLE_TENANT: ${THROTTLE_TENANT:-60000/hour}
      THROTTLE_USER_FRACAO: ${THROTTLE_USER_FRACAO:-0.05}
      THROTTLE_USER: ${THROTTLE_USER:-}
      THROTTLE_RELATORIO: ${THROTTLE_RELATORIO:-120/hour}
      THROTTLE_INTEGRACAO: ${THROTTLE_INTEGRACAO:-300/hour}
      # Quantos proxies confiáveis há entre cliente e app (hoje: só o gateway).
      # Errado, o teto por IP fica contornável por X-Forwarded-For falso — ver
      # docs/arquitetura/rate-limiting.md §2.2.
      NUM_PROXIES: ${NUM_PROXIES:-1}
      # Remodelagem, fases 2 e 3 (nucleo/autorizacao.py). Com SPICEDB_URL, toda
      # decisão de acesso é comparada com o PDP em segundo plano (a sombra) e a
      # divergência vai para `nucleo.DivergenciaAutorizacao`. Quem DECIDE continua
      # sendo o token, módulo a módulo, até `manage.py modo_autorizacao <modulo> pdp`.
      SPICEDB_URL: ${SPICEDB_URL:-http://spicedb:8443}
      SPICEDB_CHAVE: ${SPICEDB_CHAVE:-spicedb-chave-dev}
      AUTORIZACAO_REDIS_URL: ${AUTORIZACAO_REDIS_URL:-redis://redis:6379/5}
      AUTORIZACAO_SOMBRA: ${AUTORIZACAO_SOMBRA:-True}
    volumes:
      - ../../infra/keys:/keys:ro
      # Mídia compartilhada: o worker grava (PDF/XML de NF baixados da NFE.io) e o
      # erp serve `/media/`. Sem volume comum, o arquivo escrito pelo worker não é
      # visível ao erp → download 404.
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Fase 10.1: readiness real (banco + Redis + broker), não só "a porta responde".
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [sgi]
    restart: unless-stopped

  # ---------- Celery worker (A1: executor das tasks assíncronas) ----------
  # Sem este processo as tasks (baixa via webhook Asaas, geração de cobrança,
  # emissão de NF, DLQ) enfileiravam para sempre em produção. Reusa a imagem do
  # backend; consome do Redis. Ver docs/pendencias.md#A1.
  worker:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    container_name: ${SGI_PREFIX:-sgi}-worker
    profiles: ["full"]
    # `-Q celery` explícito (D57): sem isto o worker geral consome TODAS as filas,
    # inclusive a de conversão que o `worker-conversao` existe para isolar — e o
    # isolamento seria só aparente.
    #
    # **D71 — a outra metade do D57.** Isolar a conversão numa frota com teto
    # deixou esta SEM nenhum: aqui rodam a importação do impexp (que lê arquivo
    # que qualquer cliente sobe), a cobrança, a NF-e, o e-mail e os lembretes.
    # A importação tem orçamento por operação desde a IE.2; as outras quatro não
    # têm teto de espécie alguma, e o `mem_limit` é o único freio que as alcança.
    #
    # **De onde sai o número — e por que NÃO é `2g`.** A ordem do D57 exige que o
    # freio que sabe EXPLICAR estoure antes do que só mata processo, senão o
    # cgroup derruba o worker e a operação fica pendurada dizendo "processando"
    # para sempre. Aqui o freio explicativo é o `orcamento()` do impexp, cujo
    # pior caso é `IMPEXP_TETO_INFRA_MEMORIA_MB` = 2.048 MB (payment/planos.py —
    # onde caem o "Sob Medida" e o fail-open de token sem plano). Com
    # `--concurrency 2` são DOIS filhos podendo segurar 2.048 MB ao mesmo tempo:
    #   2 × 2.048 MB = 4.096 MB + o processo pai ≈ 4,25 GB de pico legítimo.
    # `2g` ficaria abaixo do orçamento de UM só filho — o cgroup mataria antes de
    # o `RLIMIT_AS` conseguir virar `MemoryError` → `RecursoExcedido`, que é
    # exatamente o defeito que a PRA.1d levou 7 minutos para achar.
    #
    # `mem_limit` é TETO, não reserva: 5g não ocupa 5 GB, limita a 5 GB.
    # Para apertar de verdade o caminho barato é baixar
    # `IMPEXP_TETO_INFRA_MEMORIA_MB` (knob comercial, visível ao dono) e só então
    # descer este número — nunca o contrário.
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency", "2",
              "-Q", "celery",
              # Rede contra vazamento lento: recicla o filho que passar do RSS.
              # 2,25 GiB fica logo ACIMA do orçamento de 2.048 MB, para operação
              # legítima no teto não provocar reciclagem a cada task.
              "--max-memory-per-child", "${WORKER_MAX_MEM_KB:-2359296}"]
    # Invariante: mem_limit > concurrency × max-memory-per-child (5 > 2 × 2,25).
    mem_limit: ${WORKER_MEM_LIMIT:-5g}
    cpus: ${WORKER_CPUS:-2}
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-erp-dev}
      DEBUG: ${DEBUG:-True}
      # Settings roda a fail-fast de produção no import; mesmo sem servir HTTP, o
      # worker/beat precisa de ALLOWED_HOSTS quando DEBUG=False (staging/produção).
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,erp,gateway}
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_DB: ${POSTGRES_DB:-erp_db}
      POSTGRES_USER: ${POSTGRES_USER:-erp_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_app_senha_dev}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_SSLROOTCERT: ${DB_SSLROOTCERT:-}
      REDIS_URL: redis://redis:6379/0
      # Camada 2 (docs/arquitetura/rate-limiting.md): baldes de token que
      # limitam a SAIDA para fornecedores (NFE.io, Asaas, Meta, LLM, SMTP).
      # DB 4, dedicado: reusar o 0 faria um FLUSHDB de manutencao nos baldes
      # apagar a fila de tarefas do Celery.
      RATE_LIMIT_REDIS_URL: ${RATE_LIMIT_REDIS_URL:-redis://redis:6379/4}
      # O worker NUNCA pode ser eager — precisa consumir do broker.
      CELERY_TASK_ALWAYS_EAGER: "False"
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem
      ASAAS_BASE_URL: ${ASAAS_BASE_URL:-https://api-sandbox.asaas.com/v3}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      NFE_IO_BASE_URL: ${NFE_IO_BASE_URL:-https://api.nfe.io/v1}
      NFE_IO_API_KEY: ${NFE_IO_API_KEY:-}
      NFE_IO_COMPANY_ID: ${NFE_IO_COMPANY_ID:-}
      # S7: segredo backend→IA obrigatório fora de DEBUG (sem fallback público).
      IA_SERVICE_SECRET_TOKEN: ${IA_SERVICE_SECRET_TOKEN:-}
      # E-mail (funcoesemail): lembrete de tarefa do CRM e lembrete de evento do
      # calendário. Até 19/07/2026 SÓ a IAM recebia MAIL_*, então esses dois
      # lembretes eram no-op silencioso em todo ambiente — o aviso in-app do
      # calendário funcionava e escondia que o e-mail nunca saía.
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Sistema de Gestão <noreply@sistemagestao.com>}
      # Fase 10.8: reconciliação serviço→serviço com o drone. Pede um JWT de
      # serviço à IAM (SERVICE_TOKEN_SECRET) e desvincula projetos órfãos ao
      # excluir obra/empreendimento. Sem DRONE_SERVICE_URL a reconciliação é no-op.
      SERVICE_TOKEN_SECRET: ${SERVICE_TOKEN_SECRET:-service-token-dev-secret}
      IAM_INTERNAL_URL: ${IAM_INTERNAL_URL:-http://iam:8001}
      DRONE_SERVICE_URL: ${DRONE_SERVICE_URL:-http://java-service:8080}
    volumes:
      - ../../infra/keys:/keys:ro
      # Mídia compartilhada: o worker grava (PDF/XML de NF baixados da NFE.io) e o
      # erp serve `/media/`. Sem volume comum, o arquivo escrito pelo worker não é
      # visível ao erp → download 404.
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$(hostname) || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [sgi]
    restart: unless-stopped

  # ---------- Celery worker de CONVERSÃO (D57: a frota separada) ----------
  # **Por que uma frota só para converter.** É a única carga do sistema cujo custo
  # é definido pelo ARQUIVO DE UM CLIENTE e não pelo nosso código: um DWG do
  # acervo real expandiu hachura até 62 GB de RAM. Na fila geral esse job divide o
  # processo com cobrança, e-mail e NF — e o kernel, ao escolher uma vítima por
  # memória, não sabe que a task ao lado estava emitindo um boleto. É o mesmo
  # desenho que plataforma de mídia usa: transcodificação nunca roda na frota de
  # uso geral.
  #
  # **Os três freios, do mais grosseiro ao mais explicativo:**
  #   `mem_limit`             — o cgroup mata o container antes de o host sofrer.
  #                             É o que protege a MÁQUINA (e a fatura da VM).
  #   `--max-memory-per-child`— o Celery recicla o filho que passar do RSS,
  #                             devolvendo ao SO a memória que o Python não
  #                             devolve. Protege a FILA de um vazamento lento.
  #   `orcamento_de_conversao`— o teto por conversão, em `limites.py`. É o único
  #                             que produz ERRO LEGÍVEL para o cliente; os dois de
  #                             cima só matam processo. Por isso é o mais apertado.
  #
  # `--concurrency 1`: converter é trabalho de CPU e memória, não de espera. Dois
  # processos aqui dobram o pico de RAM sem dobrar a vazão.
  worker-conversao:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    container_name: ${SGI_PREFIX:-sgi}-worker-conversao
    profiles: ["full"]
    command: ["celery", "-A", "config", "worker", "-l", "info",
              "-Q", "conversao", "--concurrency", "1",
              "--max-memory-per-child", "${CONVERSAO_MAX_MEM_KB:-2097152}"]
    # Teto do container. Precisa ser MAIOR que o `--max-memory-per-child` e que o
    # `PRANCHETA_CONVERSAO_MEMORIA_MB`, senão o cgroup mata antes de qualquer um
    # dos dois conseguir explicar o que houve.
    mem_limit: ${CONVERSAO_MEM_LIMIT:-3g}
    cpus: ${CONVERSAO_CPUS:-2}
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-erp-dev}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,erp,gateway}
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_DB: ${POSTGRES_DB:-erp_db}
      POSTGRES_USER: ${POSTGRES_USER:-erp_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_app_senha_dev}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_SSLROOTCERT: ${DB_SSLROOTCERT:-}
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_REDIS_URL: ${RATE_LIMIT_REDIS_URL:-redis://redis:6379/4}
      CELERY_TASK_ALWAYS_EAGER: "False"
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem
      # O orçamento por conversão (`PRANCHETA_CONVERSAO_MEMORIA_MB`/`_SEGUNDOS`)
      # NÃO é declarado aqui de propósito: o valor é do dono e vive em
      # `payment/planos.py`, de onde o `settings.py` já o lê. Declará-lo neste
      # arquivo criava dois defeitos silenciosos — o número voltava a existir em
      # arquivo de deploy, e `testes/backend/nucleo/test_tetos_no_payment.py` pula a asserção
      # quando a env existe, então o container ficaria com o valor antigo depois
      # de uma mudança em `payment/` sem nenhum teste reclamar. Para experimentar
      # um teto diferente, exporte a env no ambiente; o default correto vem do
      # payment.
      #
      # **Medição por cgroup — desligada por padrão, e a razão é medida.** Com
      # estas duas vazias, `nucleo/consumo.py` mede por amostragem a 50 ms, que é
      # piso do pico e deixou 76 dos 159 arquivos do acervo sem número. Com um
      # cgroup v2 delegado ele lê `memory.peak`, que é exato e conta pai e
      # subprocesso **juntos** — em teste de 13/08/2026, 454 MB onde a amostragem
      # reportava 372, porque as duas metades coexistem e o maior das duas não é
      # a soma delas.
      #
      # O que a delegação exige, e por que não vem ligada:
      #
      #   1. um diretório `cgroup2` gravável pelo worker, com `+memory` na
      #      `cgroup.subtree_control` e **sem processos membros** (o kernel
      #      recusa habilitar controlador em cgroup povoado — medido);
      #   2. um caminho **gravável de volta** para o cgroup de origem. Sem ele o
      #      medidor recusa a mudança e cai na amostragem, de propósito: num
      #      teste com o cgroup delegado montado fora do cgroup do container, o
      #      worker mediu certo, não conseguiu voltar e **ficou fora do próprio
      #      cgroup** — o `mem_limit` acima deixaria de valer, e o terceiro freio
      #      do §4.6 sumiria. Quando o `/proc/self/cgroup` aponta um caminho
      #      somente-leitura mas o deploy montou um alias gravável do mesmo
      #      cgroup, é `SGI_CGROUP_ORIGEM` que informa o apelido.
      #
      # No Docker puro isso significa dar ao container acesso de escrita ao
      # cgroupfs, e este é o container que abre arquivo de cliente — o
      # último a quem se dá privilégio. Em orquestrador com delegação nativa
      # (k8s, systemd) o custo é outro, e aí liga-se. **A decisão é de
      # operação, não de engenharia**, e é por isso que ela está aqui e não no
      # código.
      SGI_CGROUP_MEDICAO: ${CONVERSAO_CGROUP_MEDICAO:-}
      SGI_CGROUP_ORIGEM: ${CONVERSAO_CGROUP_ORIGEM:-}
    volumes:
      - ../../infra/keys:/keys:ro
      # Mesma mídia do erp: é aqui que a derivada convertida é gravada.
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$(hostname) || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [sgi]
    restart: unless-stopped

  # ---------- Celery beat (A1: agendador de tarefas periódicas) ----------
  # Dispara o CELERY_BEAT_SCHEDULE (hoje: lembrete de tarefas do CRM a vencer).
  # Sem beat, nada periódico roda. Um único processo beat para todo o cluster.
  beat:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    container_name: ${SGI_PREFIX:-sgi}-beat
    profiles: ["full"]
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-erp-dev}
      DEBUG: ${DEBUG:-True}
      # Settings roda a fail-fast de produção no import; mesmo sem servir HTTP, o
      # worker/beat precisa de ALLOWED_HOSTS quando DEBUG=False (staging/produção).
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,erp,gateway}
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_DB: ${POSTGRES_DB:-erp_db}
      POSTGRES_USER: ${POSTGRES_USER:-erp_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_app_senha_dev}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_SSLROOTCERT: ${DB_SSLROOTCERT:-}
      REDIS_URL: redis://redis:6379/0
      # Camada 2 (docs/arquitetura/rate-limiting.md): baldes de token que
      # limitam a SAIDA para fornecedores (NFE.io, Asaas, Meta, LLM, SMTP).
      # DB 4, dedicado: reusar o 0 faria um FLUSHDB de manutencao nos baldes
      # apagar a fila de tarefas do Celery.
      RATE_LIMIT_REDIS_URL: ${RATE_LIMIT_REDIS_URL:-redis://redis:6379/4}
      CELERY_TASK_ALWAYS_EAGER: "False"
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem
      # S7: segredo backend→IA obrigatório fora de DEBUG (sem fallback público).
      IA_SERVICE_SECRET_TOKEN: ${IA_SERVICE_SECRET_TOKEN:-}
      # E-mail (funcoesemail): lembrete de tarefa do CRM e lembrete de evento do
      # calendário. Até 19/07/2026 SÓ a IAM recebia MAIL_*, então esses dois
      # lembretes eram no-op silencioso em todo ambiente — o aviso in-app do
      # calendário funcionava e escondia que o e-mail nunca saía.
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Sistema de Gestão <noreply@sistemagestao.com>}
      # Fase 10.8: reconciliação serviço→serviço com o drone. Pede um JWT de
      # serviço à IAM (SERVICE_TOKEN_SECRET) e desvincula projetos órfãos ao
      # excluir obra/empreendimento. Sem DRONE_SERVICE_URL a reconciliação é no-op.
      SERVICE_TOKEN_SECRET: ${SERVICE_TOKEN_SECRET:-service-token-dev-secret}
      IAM_INTERNAL_URL: ${IAM_INTERNAL_URL:-http://iam:8001}
      DRONE_SERVICE_URL: ${DRONE_SERVICE_URL:-http://java-service:8080}
    volumes:
      - ../../infra/keys:/keys:ro
      # Mídia compartilhada: o worker grava (PDF/XML de NF baixados da NFE.io) e o
      # erp serve `/media/`. Sem volume comum, o arquivo escrito pelo worker não é
      # visível ao erp → download 404.
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [sgi]
    restart: unless-stopped

  # ---------- Remodelagem, fases 2 e 3: os dois processos do PDP ----------
  # `iam-pdp` — a reconciliação contínua (IAM → SpiceDB). A escrita normal
  # acontece na própria requisição que troca o papel; este processo existe para
  # o que ela não cobre: grava o schema ao subir, refaz o tenant cuja escrita
  # falhou (PDP fora na hora) e reconcilia tudo a cada
  # `AUTORIZACAO_SINCRONIA_PERIODO_S` (payment/planos.py §5.5p) — é o que faz
  # uma assinatura vencer no PDP sem ninguém clicar em nada.
  iam-pdp:
    build:
      context: ../..
      dockerfile: iam/Dockerfile
    container_name: ${SGI_PREFIX:-sgi}-iam-pdp
    profiles: ["full"]
    command: ["python", "manage.py", "sincronizar_pdp", "--continuo"]
    environment:
      IAM_SECRET_KEY: ${IAM_SECRET_KEY:-django-insecure-iam-dev}
      IAM_SEGUNDO_FATOR_CHAVE: ${IAM_SEGUNDO_FATOR_CHAVE:-}
      IAM_DEBUG: ${IAM_DEBUG:-True}
      IAM_ALLOWED_HOSTS: ${IAM_ALLOWED_HOSTS:-localhost,127.0.0.1,iam,gateway}
      JWT_SECRET: ${JWT_SECRET}
      IAM_POSTGRES_DB: ${IAM_POSTGRES_DB:-iam_db}
      IAM_POSTGRES_USER: ${IAM_POSTGRES_USER:-iam_app}
      IAM_POSTGRES_PASSWORD: ${IAM_POSTGRES_PASSWORD:-iam_app_senha_dev}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_SSLROOTCERT: ${DB_SSLROOTCERT:-}
      SESSION_REVOKE_REDIS_URL: ${SESSION_REVOKE_REDIS_URL:-redis://redis:6379/2}
      IAM_CACHE_REDIS_URL: ${IAM_CACHE_REDIS_URL:-redis://redis:6379/3}
      JWT_PRIVATE_KEY_PATH: /keys/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem
      SPICEDB_URL: ${SPICEDB_URL:-http://spicedb:8443}
      SPICEDB_CHAVE: ${SPICEDB_CHAVE:-spicedb-chave-dev}
      AUTORIZACAO_REDIS_URL: ${AUTORIZACAO_REDIS_URL:-redis://redis:6379/5}
    volumes:
      - ../../infra/keys:/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      spicedb:
        condition: service_healthy
    networks: [sgi]
    restart: unless-stopped

  # `pdp-invalidador` — lê o Watch do SpiceDB e sobe a versão da pessoa (ou do
  # tenant) afetada no Redis; a decisão cacheada deixa de ser lida na hora
  # (§10.8). É o que faz a revogação valer em segundos com cache de um minuto.
  pdp-invalidador:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    container_name: ${SGI_PREFIX:-sgi}-pdp-invalidador
    profiles: ["full"]
    command: ["python", "manage.py", "vigiar_pdp"]
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-erp-dev}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,erp,gateway}
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_DB: ${POSTGRES_DB:-erp_db}
      POSTGRES_USER: ${POSTGRES_USER:-erp_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_app_senha_dev}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_SSLROOTCERT: ${DB_SSLROOTCERT:-}
      REDIS_URL: redis://redis:6379/0
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem
      SPICEDB_URL: ${SPICEDB_URL:-http://spicedb:8443}
      SPICEDB_CHAVE: ${SPICEDB_CHAVE:-spicedb-chave-dev}
      AUTORIZACAO_REDIS_URL: ${AUTORIZACAO_REDIS_URL:-redis://redis:6379/5}
    volumes:
      - ../../infra/keys:/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      spicedb:
        condition: service_healthy
    networks: [sgi]
    restart: unless-stopped

  # ---------- Shell React (app UI) ----------
  react:
    build: ../../frontend
    container_name: ${SGI_PREFIX:-sgi}-react
    profiles: ["full"]
    networks: [sgi]
    restart: unless-stopped

  # ---------- funcoesODM: banco próprio ----------
  funcoesodm-db:
    image: postgres:15-alpine
    container_name: ${SGI_PREFIX:-sgi}-odm-db
    profiles: ["full"]
    environment:
      POSTGRES_DB: ${ODM_POSTGRES_DB:-funcoesodm}
      POSTGRES_USER: ${ODM_POSTGRES_USER:-funcoesodm}
      POSTGRES_PASSWORD: ${ODM_POSTGRES_PASSWORD:-funcoesodm_dev}
    volumes:
      - odm_db_data:/var/lib/postgresql/data
      - ../../ImgDrone/funcoesODM/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ODM_POSTGRES_USER:-funcoesodm} -d ${ODM_POSTGRES_DB:-funcoesodm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [sgi]
    restart: unless-stopped

  # ---------- funcoesODM: NodeODM (processamento) ----------
  nodeodm:
    build: ../../ImgDrone/funcoesODM/docker/nodeodm
    image: funcoesodm/nodeodm:numpy-fix
    container_name: ${SGI_PREFIX:-sgi}-nodeodm
    profiles: ["full"]
    volumes:
      - nodeodm_data:/var/www/data
      - potree_data:/potree/data
    networks: [sgi]
    restart: unless-stopped

  # ---------- funcoesODM: Potree Converter ----------
  potree-converter:
    build: ../../ImgDrone/funcoesODM/docker/potree-converter
    container_name: ${SGI_PREFIX:-sgi}-potree
    profiles: ["full"]
    environment:
      - NODEODM_DATA=/nodeodm/data
      - POTREE_OUTPUT=/potree/data
      - PORT=5001
    volumes:
      - nodeodm_data:/nodeodm/data:ro
      - potree_data:/potree/data
    networks: [sgi]
    restart: unless-stopped

  # ---------- funcoesODM: backend Java (resource server da IAM) ----------
  java-service:
    build: ../../ImgDrone/funcoesODM/backend/java-service
    container_name: ${SGI_PREFIX:-sgi}-odm-java
    profiles: ["full"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://funcoesodm-db:5432/${ODM_POSTGRES_DB:-funcoesodm}
      SPRING_DATASOURCE_USERNAME: ${ODM_POSTGRES_USER:-funcoesodm}
      SPRING_DATASOURCE_PASSWORD: ${ODM_POSTGRES_PASSWORD:-funcoesodm_dev}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: "3600000"
      APP_MODULE_REQUIRED: drone
      APP_LOCAL_LOGIN_ENABLED: "false"
      # Fase 10.8: origens permitidas (CORS + handshake WebSocket). Precisa incluir
      # o gateway de borda — senão o browser servido pelo domínio único é barrado
      # no CORS antes do handshake do /ws. Em produção, o domínio real.
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:8088,http://nginx:80,http://localhost:8090}
      # Fase 5: valida RS256 com a chave pública da IAM (não conhece a privada).
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem
      # Fase 10.6.5: revogação imediata de sessão (mesmo Redis/DB2/chave do backend).
      SESSION_REVOKE_REDIS_URL: ${SESSION_REVOKE_REDIS_URL:-redis://redis:6379/2}
      # D205: o drone pergunta "usa o módulo?" ao PDP (security/AutorizacaoService),
      # com o mesmo cache (Redis DB 5) e as mesmas chaves do backend.
      SPICEDB_URL: ${SPICEDB_URL:-http://spicedb:8443}
      SPICEDB_CHAVE: ${SPICEDB_CHAVE:-spicedb-chave-dev}
      AUTORIZACAO_REDIS_URL: ${AUTORIZACAO_REDIS_URL:-redis://redis:6379/5}
      # Fase 4: sem Redis, a sessão (sid) é perguntada à IAM (classe B).
      IAM_INTERNAL_URL: ${IAM_INTERNAL_URL:-http://iam:8001}
    depends_on:
      funcoesodm-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      nodeodm:
        condition: service_started
      potree-converter:
        condition: service_started
    volumes:
      - uploads_data:/app/uploads
      - nodeodm_data:/nodeodm/data
      - potree_data:/potree/data:ro
      - ../../infra/keys:/keys:ro
      # O relógio do PDP, gerado do payment/planos.py (D205).
      - ../../funcoesautorizacao/gerado:/authz:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks: [sgi]
    restart: unless-stopped

  # ---------- funcoesODM: frontend Angular (nginx interno, serve sob /drone/) ----------
  drone-nginx:
    build: ../../ImgDrone/funcoesODM/frontend
    container_name: ${SGI_PREFIX:-sgi}-odm-nginx
    profiles: ["full"]
    depends_on:
      java-service:
        condition: service_healthy
    volumes:
      - potree_data:/potree/data:ro
    networks: [sgi]
    restart: unless-stopped

  # ---------- Gateway de borda (domínio único) ----------
  gateway:
    image: nginx:alpine
    container_name: ${SGI_PREFIX:-sgi}-gateway
    profiles: ["full"]
    ports:
      - "${GATEWAY_PORT:-8090}:80"
    volumes:
      - ../../infra/gateway/nginx.unified.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      iam:
        condition: service_healthy
      erp:
        condition: service_healthy
      java-service:
        condition: service_healthy
      react:
        condition: service_started
      drone-nginx:
        condition: service_started
    networks: [sgi]
    restart: unless-stopped

  # ---------- Observabilidade (Fase 10.1) — perfil opcional ----------
  # Sobe SÓ com `--profile observability` (não infla o `full`). Faz scrape dos
  # /metrics do backend e da IAM. Dashboards/alertas (Grafana + Alertmanager) são o
  # próximo passo — ver docs/../infra/observability/README.md.
  prometheus:
    image: prom/prometheus:latest
    container_name: ${SGI_PREFIX:-sgi}-prometheus
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ../../infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    networks: [sgi]
    restart: unless-stopped

networks:
  sgi:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  odm_db_data:
  uploads_data:
  media_data:
  nodeodm_data:
  potree_data:
  prom_data:
