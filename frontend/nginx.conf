# Serve a SPA React (app). As chamadas a /api, /auth, /drone, /odm-api saem do
# browser para o GATEWAY (mesma origem), não para este container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Assets com hash no nome (Vite) nunca mudam de conteúdo: cache eterno.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # O index.html é o ponteiro para os hashes do build — precisa ser revalidado
    # sempre, senão o browser continua servindo o bundle da versão anterior
    # depois de um rebuild da imagem.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
