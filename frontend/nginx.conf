# Serve a SPA React (app). As chamadas a /api, /auth, /drone, /odm-api saem do
# browser para o GATEWAY (mesma origem), não para este container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
