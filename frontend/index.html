<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SGI — Gestão integrada de obras, empreendimentos e drones com IA. Plataforma SaaS para construtoras e incorporadoras." />
    <title>SGI — Sistema de Gestão Integrada</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Identidade Malha v1 (docs/identidade-visual.md §6): Archivo (letreiro) · Inter (produto) · JetBrains Mono (instrumento) -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Aplica o tema antes do primeiro paint (evita flash claro→escuro) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('sgi_theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
