# ============================================================
# API Gateway da plataforma (Fase 2) — domínio único.
#
# Roteia tudo sob um só host, fechando o DoD #1 (SSO no browser):
#   /          -> React (shell ERP)
#   /api/      -> Django (ERP, resource server da IAM)
#   /auth/     -> IAM (login/refresh/me)
#   /drone/    -> Angular (funcoesODM), servido pelo nginx interno do drone
#   /odm-api/  -> Java (funcoesODM) — reescrito para /api/v1/
#   /ws/       -> Java (WebSocket das anotações, com upgrade)
#
# Em dev: ERP/IAM/React rodam no host (host.docker.internal); o drone roda
# nos containers do funcoesODM (mesma rede docker). O compose unificado com
# TODOS os serviços é a Fase 4 — aqui o gateway só amarra o que já existe.
# ============================================================

worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 0;       # uploads grandes do drone (limite na app)

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Upstreams. Em dev, ERP/IAM/React estão no host; drone na rede docker.
    # (Ajuste estes nomes/portas conforme onde cada serviço roda.)
    upstream erp_django   { server host.docker.internal:8000; }   # Django ERP (no host/WSL)
    upstream iam_service  { server host.docker.internal:8001; }   # IAM (no host/WSL)
    upstream react_shell  { server sgi-react:5173; }              # container vite (sem node no host)
    upstream drone_front  { server funcoesodm-nginx:80; }         # nginx interno do drone
    upstream drone_java   { server funcoesodm-java:8080; }        # backend Java do drone

    # Necessário para upgrade de WebSocket (Connection: upgrade/close).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        # --- IAM (autenticação / SSO) ---
        location /auth/ {
            proxy_pass http://iam_service;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- ERP (Django) ---
        location /api/ {
            proxy_pass http://erp_django;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Drone: API Java (apiUrl do Angular = /odm-api) ---
        # Reescreve /odm-api/ -> /api/v1/ (prefixo real do backend Java).
        location /odm-api/ {
            rewrite ^/odm-api/(.*)$ /api/v1/$1 break;
            proxy_pass http://drone_java;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization     $http_authorization;
            proxy_pass_header Authorization;
            proxy_connect_timeout 600;
            proxy_send_timeout    600;
            proxy_read_timeout    600;
        }

        # --- Drone: WebSocket das anotações (ws(s)://host/ws/websocket) ---
        location /ws/ {
            proxy_pass http://drone_java;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_read_timeout 3600;
        }

        # --- Drone: frontend Angular (servido sob /drone/ pelo nginx interno) ---
        location /drone/ {
            proxy_pass http://drone_front;   # preserva o prefixo /drone/
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Shell React (ERP) — tudo o que não casou acima ---
        location / {
            proxy_pass http://react_shell;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Vite dev usa WebSocket para HMR:
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
