# ============================================================
# API Gateway — variante do compose UNIFICADO (Fase 4).
# Todos os upstreams são containers do mesmo compose (sem host.docker.internal).
#   /          -> React (container nginx)
#   /api/      -> ERP (Django/gunicorn)
#   /auth/     -> IAM (Django/gunicorn)
#   /drone/    -> funcoesODM (nginx interno, serve sob /drone/)
#   /odm-api/  -> funcoesODM Java  (reescrito p/ /api/v1/)
#   /ws/       -> funcoesODM Java  (WebSocket das anotações)
# ============================================================

worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 0;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    upstream erp_django   { server erp:8000; }
    upstream iam_service  { server iam:8001; }
    upstream react_shell  { server react:80; }
    upstream drone_front  { server drone-nginx:80; }
    upstream drone_java   { server java-service:8080; }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Rate limiting do login (anti brute-force): 10 req/min por IP.
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_status 429;   # 429 Too Many Requests (em vez do 503 padrão)

    server {
        listen 80;
        server_name _;

        # --- Headers de segurança (Fase 5) ---
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;       # drone embute em iframe same-origin
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection          "0" always;
        add_header Content-Security-Policy    "frame-ancestors 'self'" always;  # anti-clickjacking
        # HSTS só faz sentido sob HTTPS (habilitar no TLS de produção):
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Login com rate limit (mais específico que /auth/ → tem precedência)
        location = /auth/login/ {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://iam_service;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /auth/ {
            proxy_pass http://iam_service;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # JWKS (chave pública RSA) — validadores externos buscam aqui.
        location /.well-known/ {
            proxy_pass http://iam_service;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API de administração do tenant na IAM (papéis/personas, permissões,
        # usuários). A barra final no proxy_pass tira o prefixo /iam/ → /iam/perfis/
        # chega como /perfis/ na IAM. Guardado por IsTenantAdmin no backend.
        location /iam/ {
            proxy_pass http://iam_service/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://erp_django;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Mídia (uploads: documentos de clientes, etc.)
        location /media/ {
            proxy_pass http://erp_django;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /odm-api/ {
            rewrite ^/odm-api/(.*)$ /api/v1/$1 break;
            proxy_pass http://drone_java;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization     $http_authorization;
            proxy_pass_header Authorization;
            proxy_connect_timeout 600;
            proxy_send_timeout    600;
            proxy_read_timeout    600;
        }

        location /ws/ {
            proxy_pass http://drone_java;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_read_timeout 3600;
        }

        location /drone/ {
            proxy_pass http://drone_front;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://react_shell;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
