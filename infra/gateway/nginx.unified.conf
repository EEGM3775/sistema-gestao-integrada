# ============================================================
# API Gateway — variante do compose UNIFICADO (Fase 4).
# Todos os upstreams são containers do mesmo compose (sem host.docker.internal).
#   /          -> React (container nginx)
#   /api/      -> backend (Django/gunicorn)
#   /auth/     -> IAM (Django/gunicorn)
#   /drone/    -> funcoesODM (nginx interno, serve sob /drone/)
#   /odm-api/  -> funcoesODM Java  (reescrito p/ /api/v1/)
#   /ws/       -> funcoesODM Java  (WebSocket das anotações)
#
# Resolução de DNS em RUNTIME (resolver + proxy_pass por variável): sem isto o
# nginx resolve o IP do upstream uma única vez no start e cacheia; um restart de
# container (ex.: após reboot da máquina) muda o IP e o gateway fica apontando
# para o antigo → 502 (connect refused). Com o resolver do Docker (127.0.0.11) e
# proxy_pass por variável, o nome é re-resolvido periodicamente.
# ============================================================

worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 0;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # DNS embutido do Docker; `valid=10s` re-resolve a cada 10s.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --- Correlação de requisição (Fase 10.1) ---
    # `request_id` único por requisição: honra um X-Request-ID recebido (raro na
    # borda) ou gera um ($request_id, hex de 32 dígitos do nginx). Propagado aos
    # upstreams (que o logam junto de tenant_id) e devolvido ao cliente.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    # Log de acesso da borda em JSON (uma linha por requisição), com o mesmo
    # `request_id` que os serviços a jusante — correlação ponta a ponta.
    log_format sgi_json escape=json
        '{"ts":"$time_iso8601","source":"gateway","request_id":"$req_id",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"duration_ms":$request_time,"upstream":"$upstream_addr",'
        '"upstream_status":"$upstream_status","bytes":$body_bytes_sent,'
        '"ip":"$remote_addr","ua":"$http_user_agent"}';
    access_log /dev/stdout sgi_json;

    # Rate limiting do login (anti brute-force): 10 req/min por IP.
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    # D23 — teto geral de /api/ por IP. Existe porque no DRF a permissão é
    # resolvida ANTES do throttle: requisição sem token a endpoint protegido leva
    # 401 e NÃO é contada por nenhum eixo da aplicação. Ou seja, inundação
    # anônima de /api/* só é barrada aqui. Folgado (20 r/s) porque um escritório
    # inteiro pode compartilhar um IP via NAT — é teto contra inundação, não
    # controle de vazão; o limite fino por empresa/usuário é o do DRF.
    limit_req_zone $binary_remote_addr zone=api:10m rate=1200r/m;
    limit_req_status 429;   # 429 Too Many Requests (em vez do 503 padrão)

    server {
        listen 80;
        server_name _;

        # Nomes dos serviços em variáveis → forçam a re-resolução via resolver.
        set $iam    http://iam:8001;
        set $erp    http://erp:8000;
        set $react  http://react:80;
        set $drone  http://drone-nginx:80;
        set $djava  http://java-service:8080;

        # --- Headers de segurança (Fase 5) ---
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;       # drone embute em iframe same-origin
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection          "0" always;
        add_header Content-Security-Policy    "frame-ancestors 'self'" always;  # anti-clickjacking
        # Devolve o request_id ao cliente (correlação de suporte). Herdado pelas
        # locations que não redefinem add_header (nenhuma aqui redefine).
        add_header X-Request-ID              $req_id always;
        # HSTS só faz sentido sob HTTPS (habilitar no TLS de produção):
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Fase 10.8: /auth/service-token/ é serviço→serviço (backend→IAM na rede
        # interna, via IAM_INTERNAL_URL). Nunca deve ser público — mesmo protegido
        # pelo segredo compartilhado, não expomos endpoint interno na borda (mesma
        # disciplina de /metrics, /readyz). Exact-match tem precedência sobre /auth/
        # e sobre o rewrite de /iam/.
        location = /auth/service-token/ { return 404; }
        location = /iam/auth/service-token/ { return 404; }

        # Login com rate limit (mais específico que /auth/ → tem precedência)
        location = /auth/login/ {
            limit_req zone=login burst=5 nodelay;
            proxy_pass $iam;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $req_id;
        }

        location /auth/ {
            proxy_pass $iam;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $req_id;
        }

        # JWKS (chave pública RSA) — validadores externos buscam aqui.
        location /.well-known/ {
            proxy_pass $iam;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $req_id;
        }

        # API de administração do tenant na IAM (papéis/personas, permissões,
        # usuários). O rewrite tira o prefixo /iam/ → /iam/perfis/ chega como
        # /perfis/ na IAM. Guardado por IsTenantAdmin no backend.
        location /iam/ {
            rewrite ^/iam/(.*)$ /$1 break;
            proxy_pass $iam;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $req_id;
        }

        location /api/ {
            # burst alto e `nodelay`: a rajada legítima é uma tela do ERP abrindo
            # (várias chamadas simultâneas), e enfileirá-la degradaria o uso normal.
            limit_req zone=api burst=300 nodelay;
            proxy_pass $erp;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $req_id;
        }

        # --- Mídia: FECHADA POR PADRÃO (D70) ---
        #
        # O Django só serve `/media/` sob DEBUG, então em produção isto já era 404.
        # O buraco é o stack de dev, onde os E2E rodam com DEBUG=True: ali um GET
        # em /media/<caminho> entrega o arquivo **fora de auth, de entitlement e da
        # RLS** — e o caminho não tem tenant, então nem o isolamento entre clientes
        # sobrevive. É o S10 outra vez, o mesmo que fez a PRA.2 tirar a leitura da
        # Prancheta de `/media/` e pôr atrás de endpoint gateado.
        #
        # O que mudou aqui é o **padrão**: antes tudo passava e o seguro era a
        # exceção; agora nada passa e um `upload_to` novo nasce fechado — a única
        # forma de isto não se repetir, já que a lista de quem grava em mídia
        # cresce sozinha.
        #
        # **A allowlist morreu em 09/08/2026, e com ela o D70.** Ela nomeava os
        # nove prefixos que ainda não tinham porta — os quatro do RH (ASO é dado
        # de saúde, LGPD art. 11), documento de cliente, nota fiscal (PDF e XML),
        # documento de obra e mídia de diário. Os nove ganharam recurso no
        # `funcoesimpexp` (`rh/impexp.py`, `clientes/impexp.py`, `obras/impexp.py`,
        # `modulodiario/impexp.py`, `moduloerp/impexp.py`,
        # `empreendimentos/impexp.py`) e os serializers passaram a publicar a URL
        # da porta única. Não há mais exceção a enumerar: `/media/` é 404 para
        # tudo, sem lista, que é o estado em que ninguém precisa lembrar de nada.
        location /media/ { return 404; }

        # Webhooks de entrada no backend (Fase 11.3 / Fase C: WhatsApp Cloud API).
        # Público por desenho — autentica pela assinatura HMAC da Meta, não por JWT
        # (ver funcoeswhatsapp/security.py). Sem esta location o path cairia no
        # SPA do React (location /) e nunca chegaria ao Django. Em produção o
        # ingress fica restrito a este path via Cloudflare Tunnel (Fase 10.3.2).
        location /webhooks/ {
            proxy_pass $erp;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $req_id;
        }

        location /odm-api/ {
            rewrite ^/odm-api/(.*)$ /api/v1/$1 break;
            proxy_pass $djava;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $req_id;
            proxy_set_header Authorization     $http_authorization;
            proxy_pass_header Authorization;
            proxy_connect_timeout 600;
            proxy_send_timeout    600;
            proxy_read_timeout    600;
        }

        location /ws/ {
            proxy_pass $djava;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Request-ID $req_id;
            proxy_read_timeout 3600;
        }

        location /drone/ {
            proxy_pass $drone;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $req_id;
        }

        location / {
            proxy_pass $react;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $req_id;
        }
    }
}
