# ============================================================
# API Gateway — variante STAGING (Fase 10.7): TLS terminado na borda.
#
# Igual ao nginx.unified.conf (mesmo roteamento), mas:
#   • escuta 443 com TLS (cert self-signed em infra/staging/certs/, gerado por
#     infra/staging/gen-selfsigned-cert.sh) e redireciona 80→443;
#   • HSTS ligado (só faz sentido sob HTTPS);
#   • X-Forwarded-Proto = https ($scheme no server TLS) → o Django em DEBUG=False
#     confia via SECURE_PROXY_SSL_HEADER e emite cookies `Secure` (fluxo de sessão
#     10.6 só é fiel a produção sob HTTPS).
#
# Em produção real o TLS termina no ingress gerenciado (Cloudflare Tunnel — 10.3.2);
# este cert self-signed é o andaime equivalente para o staging local.
# ============================================================

worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 0;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    log_format sgi_json escape=json
        '{"ts":"$time_iso8601","source":"gateway","request_id":"$req_id",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"duration_ms":$request_time,"upstream":"$upstream_addr",'
        '"upstream_status":"$upstream_status","bytes":$body_bytes_sent,'
        '"ip":"$remote_addr","ua":"$http_user_agent"}';
    access_log /dev/stdout sgi_json;

    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    # D23 — teto geral de /api/ por IP (o DRF não conta o 401 anônimo; ver
    # nginx.unified.conf). Mesma taxa do dev de propósito: o staging só vale como
    # ensaio de produção enquanto os limites forem os mesmos.
    limit_req_zone $binary_remote_addr zone=api:10m rate=1200r/m;
    limit_req_status 429;

    # HTTP → HTTPS (não serve conteúdo em claro no staging).
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SGI_STG:10m;
        ssl_session_timeout 1h;

        set $iam    http://iam:8001;
        set $erp    http://erp:8000;
        set $react  http://react:80;
        set $drone  http://drone-nginx:80;
        set $djava  http://java-service:8080;

        # --- Headers de segurança ---
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection          "0" always;
        add_header Content-Security-Policy    "frame-ancestors 'self'" always;
        add_header X-Request-ID              $req_id always;
        # HSTS: sob TLS, força HTTPS no browser por 1 ano.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Endpoint interno serviço→serviço (10.8): nunca público.
        location = /auth/service-token/ { return 404; }
        location = /iam/auth/service-token/ { return 404; }
        # Fase 4 da remodelagem: a pergunta "a sessão ainda vale?" do PEP sem Redis
        # (`/auth/interno/sessao/<sid>/`) é da rede dos serviços, nunca da borda.
        location ^~ /auth/interno/ { return 404; }
        location ^~ /iam/auth/interno/ { return 404; }

        location = /auth/login/ {
            limit_req zone=login burst=5 nodelay;
            proxy_pass $iam;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $req_id;
        }

        location /auth/ {
            proxy_pass $iam;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $req_id;
        }

        location /.well-known/ {
            proxy_pass $iam;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $req_id;
        }

        location /iam/ {
            rewrite ^/iam/(.*)$ /$1 break;
            proxy_pass $iam;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $req_id;
        }

        location /api/ {
            limit_req zone=api burst=300 nodelay;
            proxy_pass $erp;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $req_id;
        }

        # Mídia fechada por padrão — mesma régua do `nginx.unified.conf` (D70), e
        # aqui ela vale dobrado: o staging é o ambiente que roda como produção, e
        # com `DEBUG=False` o Django não serve `/media/` de qualquer forma. Manter
        # a location aberta só ensinaria o padrão errado ao `prod.yml`, que ainda é
        # esqueleto não validado e vai ser escrito olhando para este arquivo.
        #
        # A exceção enumerada que existia aqui saiu em 09/08/2026 junto com a do
        # unificado: os nove prefixos ganharam porta no `funcoesimpexp` e o D70
        # fechou. Sem lista para manter, não há lista para esquecer de encolher.
        location /media/ { return 404; }

        location /webhooks/ {
            proxy_pass $erp;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $req_id;
        }

        location /odm-api/ {
            rewrite ^/odm-api/(.*)$ /api/v1/$1 break;
            proxy_pass $djava;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization     $http_authorization;
            proxy_pass_header Authorization;
            proxy_set_header X-Request-ID      $req_id;
            proxy_connect_timeout 600;
            proxy_send_timeout    600;
            proxy_read_timeout    600;
        }

        location /ws/ {
            proxy_pass $djava;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;
            proxy_read_timeout 3600;
        }

        location /drone/ {
            proxy_pass $drone;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $req_id;
        }

        location / {
            proxy_pass $react;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $req_id;
        }
    }
}
