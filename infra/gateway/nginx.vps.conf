# ============================================================
# API Gateway — variante VPS (teste real em gmaxis.com): SEM drone, TLS na borda do Cloudflare.
#
# Derivado do nginx.staging.conf (mesmo roteamento do ERP/IAM/React), com três diferenças:
#   • escuta só :80 — o TLS termina no Cloudflare e o `cloudflared` (túnel de saída, no
#     mesmo compose) entrega aqui em HTTP; não há porta pública nem certificado local;
#   • X-Forwarded-Proto vem do Cloudflare ($xfp, https por padrão): é ele que faz o Django em
#     DEBUG=False confiar na conexão e emitir os cookies `Secure` / `__Host-`;
#   • o drone não existe neste ambiente: /odm-api, /ws, /drone e /_bff/drone respondem 404.
# ============================================================

worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 0;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    resolver 127.0.0.11 valid=10s ipv6=off;
    # O padrão é 30 s: com a IAM parada, o BFF esperava a resolução do nome por
    # meio minuto antes de responder (teste de caos, fase 6). Falha em segundos.
    resolver_timeout 5s;
    # Conectar a um serviço da mesma rede leva milissegundos; o padrão de 60 s só
    # servia para, com a IAM parada, o login esperar um minuto (teste de caos).
    # As locations do drone que sobem arquivo grande têm os próprios tempos.
    proxy_connect_timeout 5s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # O Cloudflare termina o TLS e avisa o esquema original; sem o aviso, assume https.
    map $http_x_forwarded_proto $xfp {
        default $http_x_forwarded_proto;
        ""      https;
    }

    # Atrás do túnel, $remote_addr é o cloudflared; o visitante vem em Cf-Connecting-Ip.
    map $http_cf_connecting_ip $cliente_ip {
        default $http_cf_connecting_ip;
        ""      $remote_addr;
    }

    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    log_format sgi_json escape=json
        '{"ts":"$time_iso8601","source":"gateway","request_id":"$req_id",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"duration_ms":$request_time,"upstream":"$upstream_addr",'
        '"upstream_status":"$upstream_status","bytes":$body_bytes_sent,'
        '"ip":"$cliente_ip","ua":"$http_user_agent"}';
    access_log /dev/stdout sgi_json;

    limit_req_zone $cliente_ip zone=login:10m rate=10r/m;
    # A segunda etapa do login tem zona própria, como no dev (fase 1). Faltava
    # aqui: o código do segundo fator só tinha o bloqueio por conta da IAM.
    limit_req_zone $cliente_ip zone=segundo_fator:10m rate=10r/m;
    # D23 — teto geral de /api/ por IP (o DRF não conta o 401 anônimo; ver
    # nginx.unified.conf). Mesma taxa do dev de propósito: o staging só vale como
    # ensaio de produção enquanto os limites forem os mesmos.
    limit_req_zone $cliente_ip zone=api:10m rate=1200r/m;
    limit_req_status 429;

    # BFF (fase 5): o cookie da sessão não segue para os serviços — ver
    # nginx.unified.conf.
    map $http_cookie $cookie_sem_sessao {
        "~^(?<antes>(?:.*;)?)\s*(?:__Host-)?sgi_sessao=[^;]*;?\s*(?<depois>.*)$"  "$antes$depois";
        default $http_cookie;
    }

    server {
        listen 80;
        server_name _;


        set $iam    http://iam:8001;
        set $erp    http://erp:8000;
        set $react  http://react:80;

        # --- Headers de segurança ---
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection          "0" always;
        add_header Content-Security-Policy    "frame-ancestors 'self'" always;
        add_header X-Request-ID              $req_id always;
        # HSTS: sob TLS, força HTTPS no browser por 1 ano.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Endpoint interno serviço→serviço (10.8): nunca público.
        location = /auth/service-token/ { return 404; }
        location = /iam/auth/service-token/ { return 404; }
        # Fase 4 da remodelagem: a pergunta "a sessão ainda vale?" do PEP sem Redis
        # (`/auth/interno/sessao/<sid>/`) é da rede dos serviços, nunca da borda.
        location ^~ /auth/interno/ { return 404; }
        location ^~ /iam/auth/interno/ { return 404; }

        # Fase 5 — a troca do cookie pelo access (ver nginx.unified.conf).
        location = /_bff/api {
            internal;
            proxy_pass $iam/auth/interno/bff/api/;
            proxy_method GET;
            proxy_connect_timeout 3s;
            proxy_read_timeout    10s;
            proxy_pass_request_body off;
            proxy_set_header Content-Length    "";
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Proto $xfp;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Request-ID      $req_id;
        }
        location = /auth/login/ {
            limit_req zone=login burst=5 nodelay;
            proxy_pass $iam;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $cliente_ip;
            proxy_set_header X-Forwarded-For   $cliente_ip;
            proxy_set_header X-Forwarded-Proto $xfp;
            proxy_set_header X-Request-ID      $req_id;
        }

        location = /auth/login/segundo-fator/ {
            limit_req zone=segundo_fator burst=5 nodelay;
            proxy_pass $iam;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $cliente_ip;
            proxy_set_header X-Forwarded-For   $cliente_ip;
            proxy_set_header X-Forwarded-Proto $xfp;
            proxy_set_header X-Request-ID      $req_id;
        }

        location /auth/ {
            proxy_pass $iam;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $cliente_ip;
            proxy_set_header X-Forwarded-For   $cliente_ip;
            proxy_set_header X-Forwarded-Proto $xfp;
            proxy_set_header X-Request-ID      $req_id;
        }

        location /.well-known/ {
            proxy_pass $iam;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Proto $xfp;
            proxy_set_header X-Request-ID      $req_id;
        }

        location /iam/ {
            rewrite ^/iam/(.*)$ /$1 break;
            proxy_pass $iam;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $cliente_ip;
            proxy_set_header X-Forwarded-For   $cliente_ip;
            proxy_set_header X-Forwarded-Proto $xfp;
            proxy_set_header X-Request-ID      $req_id;
        }

        location /api/ {
            limit_req zone=api burst=300 nodelay;
            auth_request /_bff/api;
            auth_request_set $bff_authorization $upstream_http_x_bff_authorization;
            proxy_set_header Authorization     $bff_authorization;
            proxy_set_header Cookie            $cookie_sem_sessao;
            proxy_pass $erp;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $cliente_ip;
            proxy_set_header X-Forwarded-For   $cliente_ip;
            proxy_set_header X-Forwarded-Proto $xfp;
            proxy_set_header X-Request-ID      $req_id;
        }

        # Mídia fechada por padrão — mesma régua do `nginx.unified.conf` (D70), e
        # aqui ela vale dobrado: o staging é o ambiente que roda como produção, e
        # com `DEBUG=False` o Django não serve `/media/` de qualquer forma. Manter
        # a location aberta só ensinaria o padrão errado ao `prod.yml`, que ainda é
        # esqueleto não validado e vai ser escrito olhando para este arquivo.
        #
        # A exceção enumerada que existia aqui saiu em 09/08/2026 junto com a do
        # unificado: os nove prefixos ganharam porta no `funcoesimpexp` e o D70
        # fechou. Sem lista para manter, não há lista para esquecer de encolher.
        location /media/ { return 404; }

        location /webhooks/ {
            proxy_set_header Cookie            $cookie_sem_sessao;
            proxy_pass $erp;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $cliente_ip;
            proxy_set_header X-Forwarded-For   $cliente_ip;
            proxy_set_header X-Forwarded-Proto $xfp;
            proxy_set_header X-Request-ID      $req_id;
        }

        # O drone (funcoesODM) não roda neste ambiente.
        location ^~ /odm-api/ { return 404; }
        location ^~ /ws/      { return 404; }
        location ^~ /drone/   { return 404; }

        location / {
            proxy_set_header Cookie            $cookie_sem_sessao;
            proxy_pass $react;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $cliente_ip;
            proxy_set_header X-Forwarded-For   $cliente_ip;
            proxy_set_header X-Forwarded-Proto $xfp;
            proxy_set_header X-Request-ID      $req_id;
        }
    }
}
