# infra/ponte/nginx.conf
# =============================================================================
# A PONTE TEMPORÁRIA — o porteiro que fica na frente do gateway
# =============================================================================
# Não faz parte do stack. É um container avulso, levantado à mão quando alguém
# precisa alcançar o SGI de fora de casa, e derrubado logo depois. Receita de uso
# e de desligamento: terminal.txt, seção 9.
#
# POR QUE ELE EXISTE, e não um túnel apontado direto para o gateway:
#
#   1. SENHA. O stack de desenvolvimento roda com `DEBUG=True` nos dois Djangos,
#      `SECRET_KEY` versionada no compose e o superusuário `dono` com senha
#      documentada no repositório. Exposto cru, qualquer varredura que ache a URL
#      entra. O `auth_basic` aqui é a única coisa entre a internet e aquilo.
#   2. `Host: localhost`. `ALLOWED_HOSTS` dos dois Djangos é
#      `['localhost', '127.0.0.1']`; um hostname de túnel levaria 400 em tudo.
#      Reescrever o Host aqui evita mexer nas settings do projeto para uma coisa
#      temporária — e settings mexidas "só por hoje" são as que ficam ligadas.
#   3. DRONE FORA (decisão do dono, 13/09/2026: *"a ponte não pode ter drone,
#      porque consome muito"*). As três rotas do drone caem em 403 abaixo.
# =============================================================================

# -----------------------------------------------------------------------------
# A senha vale para quem AINDA NÃO se autenticou na aplicação
# -----------------------------------------------------------------------------
# O problema que este `map` resolve: o React manda `Authorization: Bearer <jwt>`
# em toda chamada de API, e uma requisição HTTP só tem **um** cabeçalho
# `Authorization`. Com `auth_basic` valendo para tudo, o nginx recusaria (401)
# exatamente as chamadas que já vêm autenticadas pela IAM — o app logaria e não
# carregaria nada.
#
# Então: quem chega com `Bearer` já tem credencial de verdade e segue para o
# Django, que valida o JWT como sempre; quem chega sem, pede a senha da ponte.
# Um `Bearer` forjado não abre nada — ele só troca o 401 do nginx pelo 401 do
# Django, que é quem sabe conferir assinatura.
#
# O navegador cobre o resto sozinho: depois do primeiro desafio ele guarda a
# credencial e a reenvia nas requisições que **não** definem `Authorization`
# explicitamente — o HTML, o bundle e o POST de login.
map $http_authorization $desafio_da_ponte {
    default        "SGI - acesso temporario";
    "~*^Bearer "   off;
}

server {
    # `default_server` não é zelo: a imagem `nginx:alpine` traz um
    # `conf.d/default.conf` próprio, que carrega ANTES deste na ordem alfabética
    # e viraria o servidor padrão da porta 80 — o túnel cairia na página de boas-
    # vindas do nginx em vez do SGI. A receita do terminal.txt monta este arquivo
    # **por cima** do default.conf, e esta linha é a segunda rede, para o caso de
    # alguém montá-lo ao lado.
    listen 80 default_server;
    server_name _;

    # Upload pesado não é para a ponte: ela existe para consultar, e um arquivo
    # grande subindo por um túnel doméstico segura a conexão inteira. 25 MB
    # cobrem foto de campo e PDF de documento.
    client_max_body_size 25m;

    auth_basic           $desafio_da_ponte;
    auth_basic_user_file /etc/nginx/htpasswd;

    # -------------------------------------------------------------------------
    # O Origin acompanha o Host reescrito (D259)
    # -------------------------------------------------------------------------
    # O refresh e o logout da IAM recusam origem cross-site comparando o
    # hostname do `Origin` com o do `Host` (`_bloqueia_origem_estranha`). Aqui o
    # Host vira `localhost` (abaixo), mas o celular manda
    # `Origin: https://<ponte>`: os dois nunca batiam, todo refresh dava 403 e a
    # sessão caía a cada recarga de página — o app voltava para o login.
    #
    # Reescreve-se **só a origem da própria ponte**, que é a mesma origem do
    # ponto de vista do usuário. Qualquer outra origem segue intacta e continua
    # sendo recusada lá dentro — a defesa de CSRF não muda.
    set $origem_repassada $http_origin;
    if ($http_origin = "https://$host") {
        set $origem_repassada "http://localhost";
    }

    # -------------------------------------------------------------------------
    # O DRONE NÃO ATRAVESSA
    # -------------------------------------------------------------------------
    # São três rotas, e as três precisam cair — bloquear só `/drone/` deixaria o
    # iframe morto mas a API e o WebSocket ainda servindo ortofoto e nuvem de
    # pontos, que é justamente o que pesa.
    #
    #   /drone/    → o frontend Angular do funcoesODM (o iframe da tela)
    #   /odm-api/  → a API Java: ortofotos, processamentos, malhas
    #   /ws/       → o WebSocket STOMP, que hoje é do drone e só dele
    #
    # 403 com texto, e não 404: quem abrir a tela do drone pelo celular precisa
    # entender que foi desligado de propósito, não que quebrou.
    location /drone/ {
        auth_basic off;
        default_type text/plain;
        return 403 "Drone desligado nesta ponte (consome banda e maquina demais). Use em casa.\n";
    }
    location /odm-api/ {
        auth_basic off;
        default_type text/plain;
        return 403 "Drone desligado nesta ponte.\n";
    }
    location /ws/ {
        auth_basic off;
        default_type text/plain;
        return 403 "Drone desligado nesta ponte.\n";
    }

    # -------------------------------------------------------------------------
    # O login SEMPRE pede a senha da ponte
    # -------------------------------------------------------------------------
    # Aqui o `map` acima não vale, de propósito. Sem esta exceção, mandar um
    # `Authorization: Bearer qualquer-coisa` no POST de login pularia o porteiro
    # e deixaria alguém tentar `dono/dono123` à vontade. Com ela, para sequer
    # chegar à tela de login é preciso passar pela senha da ponte primeiro.
    location = /auth/login/ {
        auth_basic           "SGI - acesso temporario";
        auth_basic_user_file /etc/nginx/htpasswd;

        proxy_pass http://sgi-gateway:80;
        proxy_set_header Host              localhost;
        proxy_set_header Origin            $origem_repassada;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    # -------------------------------------------------------------------------
    # O RESTO VAI PARA O GATEWAY, COMO SE VIESSE DO LOCALHOST
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://sgi-gateway:80;

        # A linha que faz o `ALLOWED_HOSTS` continuar valendo sem ser editado.
        proxy_set_header Host              localhost;
        proxy_set_header Origin            $origem_repassada;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # O túnel termina o TLS; sem isto o Django enxerga a origem como http.
        proxy_set_header X-Forwarded-Proto https;

        # Celular em rede móvel é lento: o padrão de 60s derruba relatório e
        # listagem grande no meio.
        proxy_connect_timeout  30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
